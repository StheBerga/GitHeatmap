name: macOS build and tests

on:
  push:
    branches:
      - feature/running-activity-source
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Keep only the newest build for this branch to avoid a backlog of queued macOS runners.
concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Swift tests and Xcode build
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build Swift package
        working-directory: ContribHeatmap
        run: swift build

      - name: Run logic tests
        working-directory: ContribHeatmap
        run: swift run test-runner

      - name: Build macOS app and widget extension
        working-directory: ContribHeatmap
        run: |
          xcodebuild \
            -project ContribHeatmap.xcodeproj \
            -scheme ContribHeatmap \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/GitHeatmap-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
